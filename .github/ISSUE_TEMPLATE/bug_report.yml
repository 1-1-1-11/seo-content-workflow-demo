name: 缺陷
description: 流水线、审核或 CLI 的行为和预期不一致
title: "bug: "
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 写出实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 如何复现
      description: 命令、关键词和 profile 片段。不要贴密钥、客户名、生产站点或本机路径。
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 退出码、相关产物文件名。不要附上完整客户稿件。
